version: 2
updates:
  # Keeps the pinned action SHAs current. The cooldown gives a bad release two weeks to be pulled.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
  # The site's npm packages (ADR-0005), grouped so one PR carries a week's updates. NepDate's own
  # packages skip the cooldown, so the site shows a new release as soon as it is published.
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
      exclude: ["nepdate-core", "nepdate-patro", "nepdate-datepicker"]
    groups:
      site:
        patterns: ["*"]
    # @astrojs/check accepts TypeScript ^5 || ^6 only (0.9.12); drop this when it accepts 7.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  # The patro site's npm packages (ADR-0006), on the same terms as the site's.
  - package-ecosystem: npm
    directory: /patro
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
      exclude: ["nepdate-core", "nepdate-patro"]
    groups:
      patro:
        patterns: ["*"]
