version: 2
updates:
  # Keeps the pinned action SHAs current. The cooldown gives a bad release a week to be pulled.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
  # The site's npm packages (ADR-0005), grouped so one PR carries a week's updates.
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      site:
        patterns: ["*"]
    # @astrojs/check accepts TypeScript ^5 || ^6 only (0.9.12); drop this when it accepts 7.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
