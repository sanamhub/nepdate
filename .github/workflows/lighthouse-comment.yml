name: lighthouse-comment

# Posts a site's Lighthouse table (web/lighthouse.mjs) as one pull request comment, updated on each
# push. site.yml and patro.yml call it after their build, so the build never holds a token that can
# write; the caller runs it only for pull requests from this repository.

on:
  workflow_call:
    inputs:
      site:
        description: The site name web/lighthouse.mjs was given, e.g. patro
        required: true
        type: string

# No top-level permissions: a called workflow may not ask for more than its caller's job grants,
# and the callers grant only pull-requests: write.

jobs:
  comment:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: ${{ inputs.site }}-lighthouse
          path: lighthouse
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SITE: ${{ inputs.site }}
        with:
          script: |
            const { existsSync, readFileSync } = await import("node:fs");
            if (!existsSync("lighthouse/summary.md")) return core.notice("No Lighthouse summary: the build stopped before it.");
            const body = readFileSync("lighthouse/summary.md", "utf8");
            const marker = `<!-- ${process.env.SITE}-lighthouse -->`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const mine = comments.find((c) => c.user?.type === "Bot" && c.body?.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
