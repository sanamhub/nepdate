name: ci

on:
  pull_request:
  push:
    branches: [main]
  # The sync workflows start CI this way on the PRs they open with GITHUB_TOKEN.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: ./scripts/ci.sh
      # Information only: the upstream sync raises an issue when data runs out.
      - run: python tools/data_status.py
        continue-on-error: true
