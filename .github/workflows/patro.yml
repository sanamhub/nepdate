name: patro

# patro.nepdate.com (ADR-0006). Cloudflare Workers Builds deploys it; this workflow is the gate a
# pull request must pass first: types, the data tests, a full build of every page, no high or
# critical advisory in the dependencies, and Lighthouse on the built pages (web/lighthouse.mjs:
# every category at 100, performance at 95 or more, on a phone and a desktop). On a pull request
# the Lighthouse scores also go in one comment, updated on each push. It also runs when a file
# patro/ borrows from site/ or web/ changes.

on:
  pull_request:
    paths:
      - "patro/**"
      - "site/fonts.mjs"
      - "site/src/styles/tokens.css"
      - "web/**"
      - "site/src/assets/nepdate.svg"
      - "site/public/favicon.svg"
      - "site/public/footer-skyline.svg"
      - ".github/workflows/patro.yml"
      - ".github/workflows/lighthouse-comment.yml"
  push:
    branches: [main]
    paths:
      - "patro/**"
      - "site/fonts.mjs"
      - "site/src/styles/tokens.css"
      - "web/**"
      - "site/src/assets/nepdate.svg"
      - "site/public/favicon.svg"
      - "site/public/footer-skyline.svg"
      - ".github/workflows/patro.yml"
      - ".github/workflows/lighthouse-comment.yml"

permissions:
  contents: read

concurrency:
  group: patro-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: patro

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: patro/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm run build
      - run: npm run lighthouse
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: patro-lighthouse
          path: patro/lighthouse/
          if-no-files-found: ignore
          retention-days: 14

  # The Lighthouse table as a pull request comment (lighthouse-comment.yml). Pull requests from
  # forks get the job summary only.
  lighthouse-comment:
    needs: build
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      pull-requests: write
    uses: ./.github/workflows/lighthouse-comment.yml
    with:
      site: patro
