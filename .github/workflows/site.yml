name: site

# nepdate.com (ADR-0005). Cloudflare Workers Builds deploys it; this workflow is the gate a pull
# request must pass first: types, versions only in ports.ts, a build with every internal link
# checked, and no high or critical advisory in the dependencies.

on:
  pull_request:
    paths: ["site/**", "web/**", ".github/workflows/site.yml"]
  push:
    branches: [main]
    paths: ["site/**", "web/**", ".github/workflows/site.yml"]

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: site

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm run build
